# Render Blueprint Specification for AgroArmor
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Python Flask ML Disease Detection Microservice
  - type: web
    name: agroarmour-ml
    runtime: python
    rootDir: Farmers-development/ML
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Node.js Express Backend API
  - type: web
    name: agroarmour-backend
    runtime: node
    rootDir: Farmers-development/farm/backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        value: https://agroarmourlsm-frontend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # 3. React Vite Frontend (Static Site on Global CDN)
  - type: web
    name: agroarmourlsm-frontend
    runtime: static
    rootDir: Farmers-development/farm/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agroarmour-backend.onrender.com
      - key: VITE_ML_API_URL
        value: https://agroarmour-ml.onrender.com
