# Render Blueprint Specification for AgroArmor
# Personal Owner: Kruthikajimme
# Repository: https://github.com/Kruthikajimme/agro-armor
# Docs: https://render.com/docs/blueprint-spec

services:
  # 1. Python Flask ML Disease Detection Microservice
  - type: web
    name: agro-armor-ml
    runtime: python
    region: singapore
    rootDir: Farmers-development/ML
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Node.js Express Backend API
  - type: web
    name: agro-armor-backend
    runtime: node
    region: singapore
    rootDir: Farmers-development/farm/backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ORIGIN
        value: https://agro-armor-frontend.onrender.com
      - key: ML_API_URL
        value: https://agro-armor-ml.onrender.com
      - key: DB_NAME
        value: agroarmor
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # 3. React Vite Frontend (Static Site on Global CDN)
  - type: web
    name: agro-armor-frontend
    runtime: static
    rootDir: Farmers-development/farm/frontend
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://agro-armor-backend.onrender.com
      - key: VITE_ML_API_URL
        value: https://agro-armor-ml.onrender.com
